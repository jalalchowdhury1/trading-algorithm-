# Reads the NUTS signal and messages Telegram ONLY when the holding changed.
#
# Schedule is deliberately keyed to NUTS's own compute cron
# (`cron(5,35 13-20 ? * MON-FRI)` — it recomputes at :05 and :35). We poll at
# :10 and :40, five minutes behind, so we always read a freshly computed value
# rather than racing it.
#
# 13-21 UTC covers market hours in BOTH DST states (9:30-16:00 ET is 13:30-20:00
# UTC in EDT and 14:30-21:00 in EST). Extra runs outside the session are free:
# the holding will not have changed, so nothing is sent. That is the point of
# change-only messaging — polling more often costs noise nothing and shortens
# the time to hear about a real move.
name: NUTS signal watch

on:
  schedule:
    - cron: '10,40 13-21 * * 1-5'
  workflow_dispatch:
    inputs:
      force_send:
        description: "Send even if the holding did not change"
        type: boolean
        default: false
      force_warning:
        description: "Send a proximity warning for whatever is near (test)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nuts-signal-watch
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Validate secrets
        run: |
          [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] || {
            echo "::error::Missing TELEGRAM_TOKEN / TELEGRAM_CHAT_ID repo secrets"; exit 1; }

      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # No pip install: the signal path is pure stdlib now that NUTS owns the
      # maths. pytest is dev-only and runs below.
      - name: Unit tests
        run: |
          pip install -q -r requirements-dev.txt
          python -m pytest tests/ -q

      - name: Read NUTS and alert on change
        run: python main.py ${{ inputs.force_send && '--force-send' || '' }} ${{ inputs.force_warning && '--force-warning' || '' }}

      - name: Commit state if the holding changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trading_state.json
          if ! git diff --cached --quiet; then
            git commit -m "signal change: $(python -c "import json;print(json.load(open('trading_state.json'))['holding'])") [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Failure alert to Telegram
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="⚠️ NUTS signal watch FAILED: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
